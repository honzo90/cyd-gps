; Cyd+GPS — CYD2USB + u-blox NEO-8M (NMEA 9600 on UART2: GPS TX->IO27, RX->IO22, CN1). Arduino-ESP32 2.0.17 + LVGL 9.2.
[env:cyd2usb]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; CYD2USB panel: ST7789, BGR, inversion off. This unit needs no mirror.
    -DCYD_LCD_BGR=1
    -DCYD_LCD_INVERT=0
    -DCYD_LCD_MIRROR_X=0
    -DCYD_LCD_MIRROR_Y=0
    ; public repo with the releases the device updates from (tools/release.sh publishes them)
    -DGH_REPO=\"honzo90/cyd-gps\"

board_build.embed_txtfiles =
    src/gh_roots.pem
    src/web/rides.js

lib_deps =
    lvgl/lvgl@9.2.2
    mikalhart/TinyGPSPlus@^1.1.0

; Same firmware with synthetic NMEA instead of the UART (UI bring-up)
[env:cyd2usb_sim]
extends = env:cyd2usb
build_flags = ${env:cyd2usb.build_flags} -DGPS_SIM

; Deliberately broken image for testing OTA rollback (crashes after 8 s). Never release it.
[env:cyd2usb_rollbacktest]
extends = env:cyd2usb
build_flags = ${env:cyd2usb.build_flags} -DROLLBACK_TEST -DFW_VERSION=\"1.0.6-rollbacktest\"
