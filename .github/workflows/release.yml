# Builds the firmware for a version tag (v1.2.3) and publishes a GitHub release with
# firmware.bin + version.txt. The CYD checks releases/latest/download/version.txt.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match include/fw_version.h
        id: ver
        run: |
          file_ver=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' include/fw_version.h)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "file=$file_ver tag=$tag_ver"
          if [ "$file_ver" != "$tag_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match FW_VERSION $file_ver"
            exit 1
          fi
          echo "version=$file_ver" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Host tests
        run: sh test/host/run.sh

      - name: Build
        run: |
          pip install platformio==6.1.19
          pio run -e cyd2usb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/cyd2usb/firmware.bin firmware.bin
          echo "${{ steps.ver.outputs.version }}" > version.txt
          sha256sum firmware.bin > firmware.bin.sha256
          gh release create "$GITHUB_REF_NAME" firmware.bin version.txt firmware.bin.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
